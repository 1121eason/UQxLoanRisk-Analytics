name: Validate portfolio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test data-quality behaviour
        run: python -m unittest discover -s tests -v
      - name: Reproduce the synthetic audit
        run: python scripts/audit_data.py data/demo/loan_demo.csv --output output/demo-audit.json
      - name: Check committed evidence and public-file boundary
        run: python scripts/verify_repository.py
