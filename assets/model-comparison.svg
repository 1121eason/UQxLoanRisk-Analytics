<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Reported random forest and logistic regression performance comparison"><title>Reported random forest and logistic regression performance comparison</title><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="490" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/><text x="40" y="42" font-size="27" fill="#1c3047" font-weight="700">Historical model comparison</text><text x="40" y="73" font-size="16" fill="#536c83" font-weight="400">Recomputed from report confusion matrices / 9,998 evaluated outcomes / Default is the positive class</text><rect x="40" y="94" width="14" height="14" rx="2" fill="#157f82" stroke="#157f82"/><text x="64" y="107" font-size="15" fill="#157f82" font-weight="700">Random Forest</text><rect x="250" y="94" width="14" height="14" rx="2" fill="#426bc1" stroke="#426bc1"/><text x="274" y="107" font-size="15" fill="#426bc1" font-weight="700">Logistic Regression</text><text x="40" y="162" font-size="18" fill="#1c3047" font-weight="700">Accuracy</text><rect x="260" y="137" width="720" height="24" rx="3" fill="#e1e9f0" stroke="#e1e9f0"/><rect x="260" y="137" width="601.82" height="24" rx="3" fill="#157f82" stroke="#157f82"/><text x="1005" y="156" font-size="20" fill="#157f82" font-weight="700">83.59%</text><rect x="260" y="171" width="720" height="24" rx="3" fill="#e1e9f0" stroke="#e1e9f0"/><rect x="260" y="171" width="266.96" height="24" rx="3" fill="#426bc1" stroke="#426bc1"/><text x="1005" y="190" font-size="20" fill="#426bc1" font-weight="700">37.08%</text><text x="40" y="260" font-size="18" fill="#1c3047" font-weight="700">Default precision</text><rect x="260" y="235" width="720" height="24" rx="3" fill="#e1e9f0" stroke="#e1e9f0"/><rect x="260" y="235" width="201.1" height="24" rx="3" fill="#157f82" stroke="#157f82"/><text x="1005" y="254" font-size="20" fill="#157f82" font-weight="700">27.93%</text><rect x="260" y="269" width="720" height="24" rx="3" fill="#e1e9f0" stroke="#e1e9f0"/><rect x="260" y="269" width="91.03" height="24" rx="3" fill="#426bc1" stroke="#426bc1"/><text x="1005" y="288" font-size="20" fill="#426bc1" font-weight="700">12.64%</text><text x="40" y="358" font-size="18" fill="#1c3047" font-weight="700">Default recall</text><rect x="260" y="333" width="720" height="24" rx="3" fill="#e1e9f0" stroke="#e1e9f0"/><rect x="260" y="333" width="249.05" height="24" rx="3" fill="#157f82" stroke="#157f82"/><text x="1005" y="352" font-size="20" fill="#157f82" font-weight="700">34.59%</text><rect x="260" y="367" width="720" height="24" rx="3" fill="#e1e9f0" stroke="#e1e9f0"/><rect x="260" y="367" width="600.57" height="24" rx="3" fill="#426bc1" stroke="#426bc1"/><text x="1005" y="386" font-size="20" fill="#426bc1" font-weight="700">83.41%</text><text x="40" y="443" font-size="15" fill="#536c83" font-weight="400">Accuracy baseline: 89.39% by predicting every case as fully paid, with zero default recall.</text><text x="40" y="471" font-size="13" fill="#536c83" font-weight="400">Historical cross-validation evidence. Models were not rerun; costs, calibration and a final holdout remain unverified.</text></g></svg>
