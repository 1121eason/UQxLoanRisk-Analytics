<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Loan default analytics overview"><title>Loan default analytics overview</title><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="560" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/><rect x="0" y="0" width="1200" height="150" rx="0" fill="#102b46" stroke="#102b46"/><text x="40" y="45" font-size="15" fill="#72d5ca" font-weight="700">LOAN DEFAULT ANALYTICS</text><text x="40" y="88" font-size="30" fill="#ffffff" font-weight="700">From borrower data to reviewable risk analysis</text><text x="40" y="121" font-size="17" fill="#d7e3ef" font-weight="400">Power BI / DAX / Power Query / RapidMiner / Python</text><rect x="40" y="174" width="265" height="98" rx="12" fill="#ffffff" stroke="#dce5ef"/><text x="58" y="203" font-size="13" fill="#536c83" font-weight="400">Case records</text><text x="58" y="246" font-size="32" fill="#102b46" font-weight="700">14,999</text><rect x="325" y="174" width="265" height="98" rx="12" fill="#ffffff" stroke="#dce5ef"/><text x="343" y="203" font-size="13" fill="#536c83" font-weight="400">Known outcomes</text><text x="343" y="246" font-size="32" fill="#102b46" font-weight="700">9,998</text><rect x="610" y="174" width="265" height="98" rx="12" fill="#ffffff" stroke="#dce5ef"/><text x="628" y="203" font-size="13" fill="#536c83" font-weight="400">Observed defaults</text><text x="628" y="246" font-size="32" fill="#102b46" font-weight="700">1,061</text><rect x="895" y="174" width="265" height="98" rx="12" fill="#ffffff" stroke="#dce5ef"/><text x="913" y="203" font-size="13" fill="#536c83" font-weight="400">Default rate on known outcomes</text><text x="913" y="246" font-size="32" fill="#102b46" font-weight="700">10.61%</text><text x="40" y="313" font-size="19" fill="#1c3047" font-weight="700">Outcome reconciliation</text><text x="40" y="338" font-size="15" fill="#536c83" font-weight="400">Unknown outcomes stay outside the measured default-rate denominator.</text><rect x="40" y="357" width="667.34" height="26" rx="0" fill="#157f82" stroke="#157f82"/><rect x="707.34" y="357" width="79.23" height="26" rx="0" fill="#d55c42" stroke="#d55c42"/><rect x="786.57" y="357" width="373.43" height="26" rx="0" fill="#a5b4c5" stroke="#a5b4c5"/><text x="40" y="410" font-size="16" fill="#157f82" font-weight="700">8,937 fully paid</text><text x="380" y="410" font-size="16" fill="#b64a34" font-weight="700">1,061 default</text><text x="690" y="410" font-size="16" fill="#536c83" font-weight="700">5,001 missing / malformed</text><rect x="40" y="441" width="265" height="75" rx="12" fill="#e7eef6" stroke="#e7eef6"/><text x="56" y="468" font-size="18" fill="#1c3047" font-weight="700">Validate</text><text x="56" y="493" font-size="14" fill="#536c83" font-weight="400">Labels and missing data</text><rect x="325" y="441" width="265" height="75" rx="12" fill="#e7eef6" stroke="#e7eef6"/><text x="341" y="468" font-size="18" fill="#1c3047" font-weight="700">Explore</text><text x="341" y="493" font-size="14" fill="#536c83" font-weight="400">Two Power BI pages</text><rect x="610" y="441" width="265" height="75" rx="12" fill="#e7eef6" stroke="#e7eef6"/><text x="626" y="468" font-size="18" fill="#1c3047" font-weight="700">Model</text><text x="626" y="493" font-size="14" fill="#536c83" font-weight="400">Cross-validation workflow</text><rect x="895" y="441" width="265" height="75" rx="12" fill="#e7eef6" stroke="#e7eef6"/><text x="911" y="468" font-size="18" fill="#1c3047" font-weight="700">Review</text><text x="911" y="493" font-size="14" fill="#536c83" font-weight="400">Code, tests and limitations</text><text x="40" y="541" font-size="13" fill="#536c83" font-weight="400">Academic case / Original dashboard and model screenshots / Reconciled aggregate results</text></g></svg>
