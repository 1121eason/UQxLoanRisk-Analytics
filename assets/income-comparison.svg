<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Observed income-category default rates and sample sizes"><title>Observed income-category default rates and sample sizes</title><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="390" rx="0" fill="#f3f6fa" stroke="#f3f6fa"/><text x="40" y="42" font-size="26" fill="#1c3047" font-weight="700">Observed default rate by income category</text><text x="40" y="72" font-size="16" fill="#536c83" font-weight="400">Recomputed from the supplied CSV / Valid labels only / October 2026 portfolio analysis</text><text x="40" y="134" font-size="20" fill="#1c3047" font-weight="700">&lt;50K</text><text x="40" y="159" font-size="14" fill="#536c83" font-weight="400">10 defaults / 40 known outcomes</text><rect x="365" y="116" width="650" height="38" rx="4" fill="#e1e9f0" stroke="#e1e9f0"/><rect x="365" y="116" width="541.67" height="38" rx="4" fill="#aa7429" stroke="#aa7429"/><text x="1040" y="142" font-size="22" fill="#aa7429" font-weight="700">25.00%</text><text x="40" y="211" font-size="20" fill="#1c3047" font-weight="700">50K–250K</text><text x="40" y="236" font-size="14" fill="#536c83" font-weight="400">826 defaults / 6,407 known outcomes</text><rect x="365" y="193" width="650" height="38" rx="4" fill="#e1e9f0" stroke="#e1e9f0"/><rect x="365" y="193" width="279.33" height="38" rx="4" fill="#157f82" stroke="#157f82"/><text x="1040" y="219" font-size="22" fill="#157f82" font-weight="700">12.89%</text><text x="40" y="288" font-size="20" fill="#1c3047" font-weight="700">&gt;250K</text><text x="40" y="313" font-size="14" fill="#536c83" font-weight="400">225 defaults / 3,551 known outcomes</text><rect x="365" y="270" width="650" height="38" rx="4" fill="#e1e9f0" stroke="#e1e9f0"/><rect x="365" y="270" width="137.29" height="38" rx="4" fill="#157f82" stroke="#157f82"/><text x="1040" y="296" font-size="22" fill="#157f82" font-weight="700">6.34%</text><text x="40" y="355" font-size="15" fill="#536c83" font-weight="400">The &lt;50K group has only 40 known outcomes. Show denominators and investigate uncertainty before acting.</text><text x="40" y="379" font-size="13" fill="#536c83" font-weight="400">These are unadjusted associations in a teaching case, not model performance or evidence of causality.</text></g></svg>
